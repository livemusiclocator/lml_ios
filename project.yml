name: LML
options:
  bundleIdPrefix: au.com.livemusiclocator
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  LML:
    type: application
    platform: iOS
    sources: [LML]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LML_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LML
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: To show the gigs near you.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
  LMLTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LMLTests]
    dependencies:
      - target: LML
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LML:
    build:
      targets:
        LML: all
        LMLTests: [test]
    test:
      targets: [LMLTests]
